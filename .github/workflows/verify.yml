name: Verify Companion
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:public
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
