name: Verify Companion
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:public
      - name: Real browser response and lost-save recovery
        run: node scripts/browser-smoke.ts
      - name: Fixture screenshots for sandbox visual inspection
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for path in sorted(Path('artifacts').glob('member-*.png')):
              print('COMPANION_SCREENSHOT ' + path.name + ' ' + base64.b64encode(path.read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-web-screenshots
          path: artifacts/member-*.png
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Lint findings for the next development session
        if: always()
        working-directory: apps/android
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
